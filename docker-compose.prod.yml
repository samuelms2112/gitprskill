# Stack de produção para um Droplet pequeno.
# Só o Caddy (portas 80/443) é exposto. Postgres e Redis ficam na rede interna.
# A IA é o Claude Code CLI, autenticado no servidor: o login fica em /root/.claude (montado no backend e no worker).
#
# Uso (feito pelo scripts/deploy_digitalocean.sh):
#   docker compose -f docker-compose.prod.yml up -d --build

name: github-management-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Roda como root só para ler o login do Claude Code em /root/.claude (ver nota no worker).
    user: "0:0"
    env_file: .env
    # Sobrescreve o .env para apontar para os nomes de serviço da rede interna.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ghmgmt}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-github_management}
      REDIS_URL: redis://redis:6379/0
      HOME: /root
      FRONTEND_URL: https://${DOMAIN:?Defina DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      ENVIRONMENT: production
    # A API usa o Claude Code para o diagnóstico da sessão e o login (/api/v1/system/claude).
    volumes:
      - /root/.claude:/root/.claude
      - /root/.claude.json:/root/.claude.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Roda como root: o login do Claude Code fica em /root/.claude, que um usuário sem privilégios não lê.
    user: "0:0"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ghmgmt}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-github_management}
      REDIS_URL: redis://redis:6379/0
      HOME: /root
      ENVIRONMENT: production
    # Login do Claude Code (persistido no host). Criados antes do primeiro start: sem o arquivo, o Docker cria uma pasta no lugar.
    volumes:
      - /root/.claude:/root/.claude
      - /root/.claude.json:/root/.claude.json
    # O worker herda o healthcheck HTTP da imagem do backend (não há servidor HTTP aqui): substitui por um ping do Celery.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app:celery_app inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    # Uma tarefa por vez: num droplet pequeno, paralelismo só aumentaria a memória usada.
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Sobe em relação ao Ollama antigo: o processo do Claude Code (Node.js) usa mais memória que o worker sozinho.
          memory: 768M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Embutida no bundle: o navegador acessa a API pelo mesmo domínio, via Caddy.
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?Defina DOMAIN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-github_management}
      POSTGRES_USER: ${POSTGRES_USER:-ghmgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
