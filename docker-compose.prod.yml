# Stack de produção para um Droplet pequeno (4 GB de RAM + swap).
# Só o Caddy (portas 80/443) é exposto. Postgres, Redis e Ollama ficam na rede interna.
# Os limites de memória somam bem abaixo de 4 GB; o swap do script cobre picos.
#
# Uso (feito pelo scripts/deploy_digitalocean.sh):
#   docker compose -f docker-compose.prod.yml up -d --build

name: github-management-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Sobrescreve o .env para apontar para os nomes de serviço da rede interna.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ghmgmt}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-github_management}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      FRONTEND_URL: https://${DOMAIN:?Defina DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ghmgmt}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-github_management}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ENVIRONMENT: production
    # O worker herda o healthcheck HTTP da imagem do backend (não há servidor HTTP aqui): substitui por um ping do Celery.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app:celery_app inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    # Uma tarefa por vez: num droplet pequeno, paralelismo só aumentaria a memória usada.
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Embutida no bundle: o navegador acessa a API pelo mesmo domínio, via Caddy.
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?Defina DOMAIN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-github_management}
      POSTGRES_USER: ${POSTGRES_USER:-ghmgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Um modelo por vez e descarregado logo após cada resposta: o limite de memória é o que importa.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          # Um modelo de 7B/8B quantizado ocupa ~5 GB ao carregar; 6 GB dá folga para o contexto.
          memory: 6144M

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  caddy_data:
  caddy_config:
